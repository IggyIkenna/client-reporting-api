[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "client-reporting-api"
dynamic = ["version"]
description = "Client reporting, fee engine, and invoice management service"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Unified Trading System", email = "team@example.com" },
]
dependencies = [
    # Pinned to safe versions (CVE-2026-{34073,39892,44431,44432,28684})
    "urllib3>=2.7.0,<3.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "fastapi>=0.137.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "sse-starlette>=1.6.1,<2.0.0",
    "jinja2>=3.0.0,<4.0.0",
    "matplotlib>=3.9.0,<4.0.0",
    "anthropic>=0.87.0,<1.0.0",
    "google-auth>=2.40.0,<3.0.0",
    "google-cloud-logging>=3.11.0,<4.0.0",
    "google-cloud-secret-manager<3.0.0,>=2.25.0",
    "pyyaml>=6.0.1,<7.0.0",
    "unified-trading-library>=0.66.0,<1.0.0",
    "unified-api-contracts>=0.80.0,<1.0.0",
    "prometheus-client>=0.20.0,<1.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=0.25.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "ruff==0.15.0",
    "basedpyright==1.38.2",
    "pip-audit>=2.7.0,<3.0.0",
    "pip>=26.1.2",  # PYSEC-2026-196 (pip transitive via pip-audit/pip-api; fix=26.1.2)
    "bandit>=1.7.0,<2.0.0",
    "pyjwt>=2.13.0,<3.0.0",
    "ccxt<5.0.0,>=4.5.24",
    "google-cloud-firestore>=2.19.0,<3.0.0",
    "pandas<3.0.0,>=2.3.0",
    # Security floors for transitive dependencies (CVE remediation).
    # aiohttp      <3.14.0 → CVE-2026-22815, CVE-2026-34513..34525, CVE-2026-34993 (CookieJar.load RCE)
    # cryptography <46.0.7 → CVE-2026-34073, CVE-2026-39892
    # pillow       <12.3.0 → PYSEC-2026-2253/2254/2255/2256/2257
    # pygments     <2.20.0 → CVE-2026-4539
    "aiohttp>=3.14.1,<4.0.0",
    "cryptography>=47.0.0,<50.0.0",
    "pillow>=12.3.0,<13.0.0",
    "pygments>=2.20.0,<3.0.0",
]

[project.license]
text = "Proprietary"
[project.scripts]
client-reporting = "client_reporting_api.main:main"
client-reporting-manage = "client_reporting_api.cli:main"

[tool.uv.sources.unified-trading-library]
path = "../unified-trading-library"
editable = true

[tool.uv.sources.unified-api-contracts]
path = "../unified-api-contracts"
editable = true

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".cursor", ".venv", ".venv-workspace", "build", "dist", "node_modules"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "G", "C90"]
extend-ignore = ["G003", "G004"]
ignore = ["E402"]

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401", "E402"]
"tests/*" = ["F401", "F841", "F811"]
"tests/conftest.py" = ["E402"]
"client_reporting_api/core/tear_sheet_generator.py" = ["E501"]
"client_reporting_api/core/backfill_store.py" = ["C901"]
"scripts/*.py" = ["C901", "E501"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["client_reporting_api"]
exclude = ["tests", "**/__pycache__", ".venv*", ".venv-workspace", "build", "dist", "node_modules"]
reportMissingTypeStubs = false
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"

[[tool.basedpyright.executionEnvironments]]
root = "."
pythonVersion = "3.13"
pythonPlatform = "All"
extraPaths = [
    "../unified-internal-contracts",
    "../unified-trading-library",
    "../unified-config-interface",
    "../unified-cloud-interface",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "unit: mark test as unit test",
    "integration: integration tests requiring real GCP credentials and API keys",
    "smoke: mark test as smoke test",
]

[tool.coverage.run]
source = ["client_reporting_api"]
branch = true
# pytest-cov + xdist: workers are separate processes; without parallel-combine the terminal
# fail-under reads PARTIAL (controller-only) data and spuriously fails (2026-06-22: mtds saw
# terminal 46.4% while coverage.xml correctly combined to 83.95%). parallel-combine fixes the gate.
parallel = true
concurrency = ["thread", "multiprocessing"]
sigterm = true

[tool.coverage.report]
fail_under = 70

[tool.bandit]
skips = []

[tool.hatch.version]
source = "vcs"
