# Cloud Build Configuration for Library Publishing
# Libraries don't need Docker images - just lint, build wheel, and publish

steps:
  # Step 1: Run lint check
  - name: "python:3.13-slim"
    id: "lint"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        uv pip install ruff==0.15.0
        ruff check .
        ruff format --check .

  # Step 1.5: Run tests
  - name: "python:3.13-slim"
    id: "run-tests"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install uv
        uv pip install --system -e ".[dev]"
        python -m pytest tests/ -v --tb=short \
          --cov=client_reporting_api \
          --cov-fail-under=85 \
          --cov-report=xml \
          --cov-report=term-missing
    waitFor: ["lint"]

  # Step 2: Build Python package (wheel)
  - name: "python:3.13-slim"
    id: "build-wheel"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install uv build
        python -m build --wheel --outdir dist/
        ls -lh dist/
    waitFor: ["run-tests"]

  # Step 2.5: Store build metadata (version -> commit mapping)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:alpine"
    id: "store-metadata"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        apk add --no-cache python3

        WHEEL_FILE=$$(ls dist/*.whl)
        VERSION=$$(echo $$WHEEL_FILE | sed -n 's/.*-\([0-9.]*\)-.*/\1/p')

        echo "{\"version\":\"$$VERSION\",\"commit\":\"$COMMIT_SHA\",\"short_sha\":\"$SHORT_SHA\",\"build_id\":\"$BUILD_ID\",\"timestamp\":\"$$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > /tmp/build-metadata.json

        gsutil cp /tmp/build-metadata.json \
          gs://$PROJECT_ID-build-metadata/client-reporting-api/versions/$$VERSION.json || true  # || true: cleanup step, failure is intentional (metadata storage non-blocking)

        echo "✓ Stored build metadata for version $$VERSION"
    waitFor: ["build-wheel"]

  # Step 3: Publish Python package to Artifact Registry with version validation
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:alpine"
    id: "publish-python"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        apk add --no-cache python3 py3-pip jq
        pip3 install --break-system-packages twine keyrings.google-artifactregistry-auth

        WHEEL_FILE=$$(ls dist/*.whl)
        VERSION=$$(echo $$WHEEL_FILE | sed -n 's/.*-\([0-9.]*\)-.*/\1/p')

        # Check if version exists
        EXISTING_VERSIONS=$$(gcloud artifacts versions list \
          --package=client-reporting-api \
          --repository=unified-libraries \
          --location=asia-northeast1 \
          --format="value(VERSION)" 2>/dev/null || echo "")

        if echo "$$EXISTING_VERSIONS" | grep -qx "$$VERSION"; then
          if gsutil cp gs://$PROJECT_ID-build-metadata/client-reporting-api/versions/$$VERSION.json /tmp/existing-metadata.json 2>/dev/null; then
            EXISTING_COMMIT=$$(jq -r '.commit' /tmp/existing-metadata.json)

            if [ "$$EXISTING_COMMIT" = "$COMMIT_SHA" ]; then
              echo "✓ Version $$VERSION already published from commit $COMMIT_SHA (idempotent)"
              exit 0
            else
              echo "❌ ERROR: Version $$VERSION exists with DIFFERENT code!"
              echo "Current commit: $COMMIT_SHA"
              echo "Published commit: $$EXISTING_COMMIT"
              echo "Action: Bump version in pyproject.toml"
              exit 1
            fi
          else
            echo "⚠️ Version $$VERSION exists but no metadata. Bump version to be safe."
            exit 1
          fi
        fi

        # Version doesn't exist - publish
        python3 -m twine upload \
          --repository-url https://asia-northeast1-python.pkg.dev/$PROJECT_ID/unified-libraries/ \
          --non-interactive \
          dist/*.whl

        echo "✓ Successfully uploaded version $$VERSION from commit $COMMIT_SHA"
    waitFor: ["store-metadata"]

  # Step 4: Build Docker image
  - name: "gcr.io/cloud-builders/gcloud"
    id: "configure-docker"
    args:
      ["auth", "configure-docker", "asia-northeast1-docker.pkg.dev", "--quiet"]
    waitFor: ["publish-python"]

  - name: "gcr.io/cloud-builders/gcloud"
    id: "ensure-docker-repo"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud artifacts repositories describe unified-services \
          --location=asia-northeast1 &>/dev/null || \
        gcloud artifacts repositories create unified-services \
          --repository-format=docker --location=asia-northeast1 \
          --description="API services"
    waitFor: ["publish-python"]

  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    args:
      - "build"
      - "-f"
      - "Dockerfile"
      - "--build-arg"
      - "PROJECT_ID=$PROJECT_ID"
      - "-t"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-services/client-reporting-api:$SHORT_SHA"
      - "-t"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-services/client-reporting-api:latest"
      - "."
    waitFor: ["configure-docker", "ensure-docker-repo"]

  # Step 5: Push Docker image
  - name: "gcr.io/cloud-builders/docker"
    id: "push"
    args:
      [
        "push",
        "--all-tags",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-services/client-reporting-api",
      ]
    waitFor: ["build"]

  # Step 6: Vulnerability scan — check for CRITICAL CVEs in pushed image
  - name: "gcr.io/cloud-builders/gcloud"
    id: "vulnerability-scan"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        IMAGE="asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-services/client-reporting-api:$SHORT_SHA"
        echo "Waiting for Container Analysis vulnerability scan on $IMAGE..."
        for i in $(seq 1 18); do
          RESULT=$(gcloud artifacts docker images describe "$IMAGE" \
            --show-package-vulnerability --format="json" 2>/dev/null)
          if [ -n "$RESULT" ]; then
            CRITICAL=$(echo "$RESULT" | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d.get('package_vulnerability_summary',{}).get('vulnerabilities',{}).get('CRITICAL',[])))" 2>/dev/null || echo "0")
            if [ "$CRITICAL" != "0" ]; then
              echo "SCAN FAILED: $CRITICAL CRITICAL CVEs found in $IMAGE"
              exit 1
            fi
            echo "Scan complete: 0 CRITICAL CVEs"
            exit 0
          fi
          echo "Scan not ready (attempt $i/18) — waiting 10s..."
          sleep 10
        done
        echo "WARNING: Vulnerability scan did not complete within 3 minutes — proceeding"
        exit 0
    waitFor: ["push"]

images:
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-services/client-reporting-api:$SHORT_SHA"
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-services/client-reporting-api:latest"

options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY

timeout: "600s"
